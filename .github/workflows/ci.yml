name: CI

on:
  push:
    branches: [main, hardening/**]
  pull_request:

jobs:
  portable-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install optional schema validator
        run: python3 -m pip install --user jsonschema
      - name: Run portable test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Windows filesystem and trust tests
        shell: bash
        run: python3 -m unittest tests.test_batch2_1_security tests.test_batch2_2_security tests.test_batch2_3_security tests.test_batch2_4_security tests.test_batch2_5_security tests.test_batch2_5_1_security tests.test_batch2_5_2_security tests.test_batch2_5_3_security tests.test_batch3_fallback_parity -v

  godot-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb unzip wget
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Run native test suite
        env:
          GODOT_BIN: godot
        run: PATH="$HOME/.local/bin:$PATH" ./scripts/test
      - name: Run native persistent protocol integration
        env:
          GODOT_BIN: godot
          UIFORGE_RUN_NATIVE_PROTOCOL_TESTS: "1"
        run: python3 scripts/native_protocol_integration.py
      - name: Run Batch 3 Linux benchmarks
        env:
          GODOT_BIN: godot
        run: python3 scripts/benchmark_batch3.py
      - name: Upload Linux benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch3-linux-benchmark
          path: .uiforge/benchmarks/batch3-linux.json

  godot-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
          unzip -q godot.zip
          GODOT_EXE=$(find . -maxdepth 1 -name 'Godot_v4.7.2-stable_win64.exe' | head -n 1)
          mv "$GODOT_EXE" ./godot.exe
          ./godot.exe --version
      - name: Run native Windows test suite
        shell: bash
        env:
          GODOT_BIN: ./godot.exe
        run: ./scripts/test
      - name: Run native persistent protocol integration
        shell: bash
        env:
          GODOT_BIN: ./godot.exe
          UIFORGE_RUN_NATIVE_PROTOCOL_TESTS: "1"
        run: python scripts/native_protocol_integration.py
      - name: Prepare Windows machine params file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .uiforge | Out-Null
          '{"document":"examples/specs/inventory.ui.json"}' | Set-Content -Encoding utf8 .uiforge/tmp_win_params.json
      - name: Test Windows launcher via ui.cmd
        shell: cmd
        env:
          GODOT_BIN: godot.exe
        run: |
          scripts\ui.cmd capabilities
          scripts\ui.cmd validate examples\specs\inventory.ui.json
          scripts\ui.cmd --machine validate --params .uiforge\tmp_win_params.json
      - name: Run Batch 3 Windows benchmarks
        shell: bash
        env:
          GODOT_BIN: ./godot.exe
        run: python scripts/benchmark_batch3.py
      - name: Upload Windows benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch3-windows-benchmark
          path: .uiforge/benchmarks/batch3-windows.json
