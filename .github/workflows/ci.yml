name: CI

on:
  push:
    branches: [main, hardening/**]
  pull_request:

jobs:
  portable-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install optional schema validator
        run: python3 -m pip install --user jsonschema
      - name: Run portable test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Windows filesystem and trust tests
        shell: bash
        run: python3 -m unittest tests.test_batch2_1_security tests.test_batch2_2_security tests.test_batch2_3_security tests.test_batch2_4_security tests.test_batch2_5_security tests.test_batch2_5_1_security tests.test_batch2_5_2_security -v

  godot-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb unzip wget
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Run native test suite
        env:
          GODOT_BIN: godot
        run: PATH="$HOME/.local/bin:$PATH" ./scripts/test

  godot-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip
          unzip -q godot.zip
          GODOT_EXE=$(find . -maxdepth 1 -name 'Godot_v4.7.2-stable_win64.exe' | head -n 1)
          mv "$GODOT_EXE" ./godot.exe
          ./godot.exe --version
      - name: Run native Windows test suite
        shell: bash
        env:
          GODOT_BIN: ./godot.exe
        run: ./scripts/test
