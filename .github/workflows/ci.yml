name: CI

on:
  push:
    branches: [main, hardening/**]
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install optional schema validator
        run: python3 -m pip install --user jsonschema
      - name: Run portable test suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Windows filesystem and trust tests
        shell: bash
        run: python3 -m unittest tests.test_batch2_1_security tests.test_batch2_2_security tests.test_batch2_3_security -v

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb unzip wget
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Run native test suite
        env:
          GODOT_BIN: godot
        run: PATH="$HOME/.local/bin:$PATH" ./scripts/test
